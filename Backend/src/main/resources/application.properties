spring.application.name=HoloRoom

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Server
server.port=${PORT:8080}

# Groq 
api.key=${GROQ_API_KEY}

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Supabase
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}

# Chargily
chargily.api.key=${CHARGILY_API_KEY}
chargily.api.url=${CHARGILY_API_URL:https://pay.chargily.net/test/api/v2}
chargily.webhook.secret=${CHARGILY_WEBHOOK_SECRET}
chargily.webhook.url=${CHARGILY_WEBHOOK_URL}

# Frontend
frontend.url=${FRONTEND_URL}